[project]
name = "citycare-agent-starter"
version = "0.1.0"
description = "Starter repo for the agentcore assignment: a mock hospital system, a naive agent, and an eval runner."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
